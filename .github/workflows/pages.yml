name: Deploy ai-connect to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['ai-connect/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: cd ai-connect && npm test
      - name: No innerHTML in page code
        run: '! grep -rn innerHTML ai-connect/src'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-connect
      - id: deployment
        uses: actions/deploy-pages@v4
